<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Flashcard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/responsive.css">
</head>
<body data-page="study"> <!-- JS nhận diện trang này -->

    <header class="top-nav">
        <div class="nav-left">
            <button class="hamburger-btn" id="hamburger-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a class="logo" href="/" aria-label="Về trang chủ"><img src="/assets/brand-mark.png" alt=""></a>
            <div class="study-title-wrap"><span class="study-title-label">Đang học</span><span id="study-set-title">Đang tải...</span></div>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 10px;">
            <!-- Nút chỉnh sửa mặc định ẩn, chỉ hiện nếu là chủ sở hữu -->
            <button id="btn-open-quiz-setup" class="btn btn-quiz-launch" type="button"><i class="fa-solid fa-gamepad"></i><span>Làm trắc nghiệm</span></button>
            <button id="btn-reset-progress" class="btn btn-outline" style="display: none; color: #f44336; border-color: #f44336;"><i class="fa-solid fa-rotate-left"></i> Reset Tiến độ</button>
            <a href="#" id="btn-edit-set" class="btn btn-outline" style="display: none; text-decoration: none;"><i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa</a>
            <a href="/" class="btn-back"><i class="fa-solid fa-xmark"></i> Thoát</a>
        </div>
    </header>

    <main id="main-container" class="study-page">
        <div class="study-session-bar"><span><i class="fa-solid fa-layer-group"></i> Flashcard</span><span id="study-mode-label" class="study-mode-label">Thứ tự gốc</span></div>
        
        <!-- KHU VỰC THẺ 3D -->
        <div class="flashcard-container" id="fc-container">
            <div class="flashcard" id="flashcard">
                
                <!-- Mặt trước -->
                <div class="card-face card-front">
                    <span class="flashcard-hint"><i class="fa-solid fa-hand-pointer"></i> Chạm để lật thẻ</span>
                    <div class="fc-term" id="fc-front-word">...</div>
                    <div class="fc-pron" id="fc-front-pron">...</div>
                    <div class="flashcard-audio-actions"><label class="audio-autoplay-control" title="Tự động phát âm khi chuyển thẻ"><input id="auto-play-audio" type="checkbox"><span class="audio-autoplay-track"></span><span class="audio-autoplay-text">Tự phát</span></label><button class="btn-audio" id="btn-play-audio" type="button" title="Phát âm"><i class="fa-solid fa-volume-high"></i></button></div>
                </div>
                
                <!-- Mặt sau -->
                <div class="card-face card-back">
                    <div class="fc-def" id="fc-back-def">...</div>
                    <div class="fc-syn" id="fc-back-syn">...</div>
                    <div class="fc-ex" id="fc-back-ex">...</div>
                </div>

            </div>
        </div>

        <p class="study-shortcuts">
            <span class="study-shortcuts-desktop">Phím tắt: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> chuyển thẻ &bull; <kbd>Space</kbd> lật thẻ &bull; <kbd>1</kbd> Chưa nhớ &bull; <kbd>2</kbd> Đã thuộc <span class="study-swipe-hint">&bull; Vuốt để chuyển thẻ</span></span>
            <span class="study-shortcuts-mobile"><i class="fa-solid fa-hand-pointer"></i> Chạm để lật thẻ &bull; Vuốt để chuyển thẻ</span>
        </p>

        <!-- NÚT ĐIỀU KHIỂN & CHẤM ĐIỂM -->
        <div class="study-controls">
            <button class="study-progress-btn" id="btn-show-word-list" type="button" title="Bật chế độ cập nhật tiến độ" aria-pressed="false"><i class="fa-solid fa-layer-group"></i><span>Tiến độ</span></button>
            <div class="study-navigation" id="study-navigation-controls"><button class="ctrl-btn" id="btn-prev" type="button" title="Thẻ trước"><i class="fa-solid fa-arrow-left"></i></button><div class="card-counter" id="fc-counter">0 / 0</div><button class="ctrl-btn" id="btn-next" type="button" title="Thẻ tiếp theo"><i class="fa-solid fa-arrow-right"></i></button></div>
            <div class="study-review-navigation" id="study-review-controls"><button class="ctrl-btn btn-fail" id="btn-fail" type="button" title="Chưa nhớ (Phím 1)"><i class="fa-solid fa-xmark"></i></button><div class="card-counter" id="fc-counter-progress">0 / 0</div><button class="ctrl-btn btn-pass" id="btn-pass" type="button" title="Đã thuộc (Phím 2)"><i class="fa-solid fa-check"></i></button></div>
            <div class="study-review-actions"><button class="ctrl-btn btn-random" id="btn-random" type="button" title="Bật chế độ học ngẫu nhiên" aria-label="Bật chế độ học ngẫu nhiên" aria-pressed="false"><i class="fa-solid fa-shuffle"></i></button></div>
        </div>

        <!-- DANH SÁCH TỪ VỰNG CHI TIẾT BÊN DƯỚI -->
        <section class="study-word-section" id="study-word-section"><div class="study-word-heading"><div><p class="eyebrow">Ôn tập chi tiết</p><h2>Danh sách thẻ</h2></div><span id="word-list-count"></span></div><div id="word-list-container"></div></section>


        <!-- BẢNG CÀI ĐẶT QUIZ -->
        <div id="quiz-setup-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="max-width: 450px;">
                <div class="modal-header">
                    <h3>Cài đặt bài Test</h3>
                    <button id="btn-close-quiz" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div class="field-group" style="margin-top: 15px;">
                    <label>Lọc từ vựng</label>
                    <select id="quiz-filter" class="input-light" style="width: 100%; border: 1px solid #ccc;">
                        <option value="all">Tất cả từ vựng</option>
                        <option value="unlearned">Chỉ từ Chưa thuộc</option>
                        <option value="learned">Chỉ từ Đã thuộc</option>
                    </select>
                </div>

                <div class="field-group" style="margin-top: 15px;">
                    <label>Chế độ hỏi</label>
                    <select id="quiz-mode" class="input-light" style="width: 100%; border: 1px solid #ccc;">
                        <option value="en-vi">Tiếng Anh ➔ Tiếng Việt</option>
                        <option value="vi-en">Tiếng Việt ➔ Tiếng Anh</option>
                        <option value="mixed">Xáo trộn ngẫu nhiên</option>
                    </select>
                </div>

                <div class="field-group" style="margin-top: 15px;">
                    <label>Số lượng câu hỏi</label>
                    <select id="quiz-limit" class="input-light" style="width: 100%; border: 1px solid #ccc;">
                        <option value="10">10 câu</option>
                        <option value="20">20 câu</option>
                        <option value="all">Tất cả</option>
                    </select>
                </div>
                
                <button id="btn-start-quiz" class="btn btn-black w-100" style="margin-top: 25px; padding: 15px;">Bắt đầu thi</button>
            </div>
        </div>

    </main>

    <script type="module" src="/script.js"></script>
</body>
</html>
