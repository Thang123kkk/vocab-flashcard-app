<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Vocab App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body data-page="home"> <!-- Dấu hiệu nhận biết trang chủ -->

    <header class="top-nav">
        <div class="nav-left">
            <button class="hamburger-btn" id="hamburger-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="logo">📚</div>
            <!-- Dùng thẻ a href để chuyển file thực sự -->
            <a href="index.html" class="nav-btn active"><i class="fa-solid fa-house"></i> Trang chủ</a>
            <a href="created.html" class="nav-btn"><i class="fa-regular fa-folder-open"></i> Đã tạo</a>
        </div>
        <div class="nav-right">
            <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <div class="user-avatar" id="nav-avatar"><i class="fa-solid fa-user"></i></div>
        </div>
    </header>

    <main id="main-container">
        <div class="dashboard-layout">
            <!-- CỘT TRÁI -->
            <aside class="sidebar-left">
                <div class="card activity-card">
                    <div class="card-header">
                        <h3>Hoạt động học tập</h3>
<i class="fa-solid fa-gear" id="btn-open-settings" style="color: #888; cursor: pointer;" title="Cài đặt dữ liệu"></i>                    </div>
                    
                   <!-- Phần Thống kê: Từ đến hạn & Thuần thục -->
                    <div style="display: flex; gap: 15px; margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #555;">
                        <span>Từ đến hạn: <span id="due-today-count" style="color: #111;">0</span></span>
                        <span>Thuần thục: <span id="mastered-count" style="color: #111;">0</span></span>
                    </div>

                    <!-- Phần Biểu đồ dự báo -->
                    <div class="chart-area" id="forecast-chart-container">
                        <p class="chart-title" style="border-bottom: 1px dotted #ccc; padding-bottom: 5px; display: inline-block;">Dự báo ôn tập 7 ngày tới</p>
                        <div class="bars" id="forecast-bars" style="align-items: flex-end; height: 70px;">
                            <!-- JS sẽ tự động vẽ các cột vào đây -->
                        </div>
                    </div>

                    <!-- Các nút hành động phụ -->
                    <div class="action-buttons">
                        <a href="repetition.html" class="btn btn-black w-100 mb-10" style="text-decoration: none; display: block; text-align: center;">
                            <i class="fa-solid fa-calendar-days"></i> Lặp lại ngắt quãng
                        </a>
                        <div class="btn-group">
                            <!-- Nút tạo bộ thẻ này sẽ được gắn link sang trang tạo sau -->
                            <a href="create.html" class="btn btn-black w-100" style="text-decoration: none; display: block; text-align: center; padding: 15px 20px; font-size: 16px;"><i class="fa-solid fa-plus"></i> Tạo Bộ thẻ</a>
                            <button class="btn btn-outline" style="display: none;"><i class="fa-regular fa-map"></i> Tạo lộ trình</button>
                        </div>
                        <button class="btn btn-yellow w-100 mt-10"><i class="fa-solid fa-star"></i> Nâng cấp Premium</button>
                    </div>
                </div>
            </aside>

            <!-- CỘT PHẢI -->
            <section class="content-right">
                <div class="section-header">
                    <h3>Thư viện cộng đồng (Mới nhất)</h3>
                </div>
                <!-- Vùng chứa danh sách thẻ -->
                <div class="card-grid" id="learning-sets-grid"></div>
            </section>
        </div>


        <!-- BẢNG POPUP RESET DỮ LIỆU -->
        <div id="settings-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="max-width: 500px;">
                <div class="modal-header">
                    <h3>Cài đặt & Dữ liệu</h3>
                    <button id="btn-close-settings" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                
                <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                    <button id="btn-reset-all-srs" class="btn btn-outline" style="color: #ff9800; border-color: #ff9800; text-align: left;">
                        <i class="fa-solid fa-rotate-left"></i> Reset toàn bộ Tiến độ học (SRS & Đã thuộc)
                    </button>
                    
                    <button id="btn-reset-account" class="btn btn-outline" style="color: #f44336; border-color: #f44336; text-align: left;">
                        <i class="fa-solid fa-trash-can"></i> Xóa vĩnh viễn Tài khoản (Bao gồm các Bộ thẻ)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
