<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm - Vocab App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/responsive.css">
</head>
<body data-page="quiz">
    <header class="top-nav quiz-nav">
        <div class="quiz-nav-left"><a class="logo" href="/" aria-label="Về trang chủ"><img src="/assets/brand-mark.png" alt=""></a><button id="btn-quit-quiz" class="btn-back"><i class="fa-solid fa-xmark"></i> Thoát Quiz</button></div>
        <div class="quiz-nav-progress"><span id="quiz-progress-text">Câu 1 / 10</span><div class="quiz-progress-track"><div id="quiz-progress-fill" class="quiz-progress-fill"></div></div></div>
        <div class="quiz-score-mini" aria-label="Kết quả hiện tại"><span><i class="fa-solid fa-fire"></i> <strong id="quiz-streak">0</strong></span><span><i class="fa-solid fa-star"></i> <strong id="quiz-score-live">0</strong></span></div>
    </header>

    <main id="main-container" class="quiz-main">
        <div id="quiz-play-area" class="quiz-play-area">
            <div class="quiz-context"><span id="quiz-mode-badge" class="quiz-mode-badge"><i class="fa-solid fa-language"></i> Tiếng Anh → Tiếng Việt</span><span class="quiz-keyboard-hint">Chọn nhanh bằng phím <kbd>A</kbd>–<kbd>D</kbd></span></div>
            <section id="quiz-question-box" class="quiz-question-box" aria-live="polite">
                <p class="quiz-question-label">Chọn đáp án chính xác</p><h1 id="quiz-question-text">Đang tải...</h1><p id="quiz-question-hint" class="quiz-question-hint"></p>
                <button id="btn-quiz-audio" class="quiz-audio-btn" type="button" title="Nghe phát âm" aria-label="Nghe phát âm"><i class="fa-solid fa-volume-high"></i></button>
            </section>
            <div id="quiz-options-grid" class="quiz-options-grid" aria-label="Các đáp án"></div>
            <section id="quiz-action-bar" class="quiz-action-bar" aria-live="polite">
                <div id="quiz-feedback" class="quiz-feedback"></div>
                <div class="quiz-action-buttons">
                    <button id="btn-quiz-fail" class="btn btn-outline quiz-review-btn quiz-review-fail"><i class="fa-solid fa-clock-rotate-left"></i> Vào SRS</button>
                    <button id="btn-quiz-pass" class="btn btn-outline quiz-review-btn quiz-review-pass"><i class="fa-solid fa-check"></i> Đã thuộc</button>
                    <button id="btn-quiz-next" class="btn btn-black quiz-next-btn">Câu tiếp theo <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </section>
        </div>
        <section id="quiz-result-area" class="quiz-result-area" aria-live="polite">
            <div class="quiz-result-icon"><i class="fa-solid fa-trophy"></i></div><p class="quiz-result-eyebrow">Kết quả bài luyện tập</p><h1>Hoàn thành rồi!</h1>
            <div class="quiz-score-ring"><span id="score-percent">0%</span><small>chính xác</small></div><p class="quiz-result-summary">Bạn trả lời đúng <strong id="score-correct">0</strong> / <span id="score-total">0</span> câu.</p>
            <div class="quiz-result-stats"><div><i class="fa-solid fa-bullseye"></i><span>Đúng</span><strong id="result-correct">0</strong></div><div><i class="fa-solid fa-circle-xmark"></i><span>Cần ôn</span><strong id="result-incorrect">0</strong></div><div><i class="fa-solid fa-fire"></i><span>Chuỗi tốt nhất</span><strong id="result-streak">0</strong></div></div>
            <div class="quiz-result-actions"><button id="btn-replay" class="btn btn-outline"><i class="fa-solid fa-rotate-right"></i> Chơi lại</button><button id="btn-back-to-study" class="btn btn-black"><i class="fa-solid fa-book-open"></i> Quay lại bộ thẻ</button></div>
        </section>
    </main>
    <script type="module" src="/script.js"></script>
</body>
</html>
